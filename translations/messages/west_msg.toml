zh = "交通警訊——本市交通量持續擴張，
通勤族的火氣越來越大，公路上的
槍擊事件也在增加。要嘛多蓋幾條
道路和鐵軌，要嘛去弄一台防彈車。"

["2.1"]
len = 181
zh = "治安警報——本市的犯罪已經失控。
暴民在市中心搶劫、破壞。你再不
把問題壓下來，總統就要派國民兵
進來了。"

["2.2"]
len = 228
zh = "爐心熔毀——你的發電廠發生爐心
熔毀。在放射性同位素衰變完之前，
建議你避開那一帶。這問題要好幾
個世代才會過去，別憋著氣等。"

["2.3"]
len = 224
zh = "你贏了——憑著你的市政手腕與都市
計劃專業，你贏得了市鑰。當地居民
會為你立碑，並且拿你的名字為
自己的長子命名。要不要考慮選州長？"

["2.4"]
len = 275
zh = "彈劾通知——全市市民終於受夠了你
拙劣的規劃與無能的管理。一群憤怒
的暴民——由你母親帶頭——已經出現
在市政廳附近。你該認真考慮去放個
長假了，現在就去。（或者把說明書
讀一遍，再來一次。）"

["2.5"]
len = 261
zh = "怪獸來襲——有人在水域發現一隻
巨大的爬蟲類生物。牠似乎會被高
污染的地區吸引，所到之處一片狼藉。
你只能等牠離開，再從瓦礫堆重建。"

["2.6"]
len = 266
zh = "污染警報——本市的污染已經超過
模擬城市污染管理局訂定的上限。
你正冒著造成嚴重生態後果的風險。
要嘛把它清乾淨，要嘛在市政廳門口
擺個防毒面具攤位。"

["2.7"]
len = 169
zh = "超級都會——恭喜，你已經達到都市
發展的最高等級：超級都會。
如果你真的走到這一步，打通電話給
MAXIS，或把你的城市寄一份給我們，
我們也許會拿它做點有趣的事。"

["2.8"]
len = 185
zh = "大都會——你的首府已經晉升為大
都會，目前人口十萬。以你的規劃
能力，可以考慮去選州長，
或者改行做 VLSI 設計。"

["2.9"]
len = 128
zh = "首府——你的城市已經成為首府，
目前人口五萬。你的政治前途一片
光明。"

["2.10"]
len = 130
zh = "城市——你的城鎮已經長成一座完整
的城市，目前人口一萬。
繼續保持！"

["2.11"]
len = 114
zh = "城鎮——恭喜，你的村莊已經升格為
城鎮，現在有兩千位市民了。"

["2.12"]
len = 277
zh = "美國密西根州底特律，1972 年——
到了 1970 年代，海外競爭與其他
經濟因素把這座曾經的世界汽車之都
推進了衰退。地價暴跌與失業使得
市中心的犯罪惡化成長期問題。
你有十年的時間降低犯罪，
並重建本市的工業基礎。"

["2.13"]
len = 255
zh = "巴西里約熱內盧，2047 年——
到二十一世紀中葉，溫室效應讓全球
均溫上升了約華氏四度。極地冰冠
融化，全球海平面上升，沿海地區
被洪水與侵蝕摧毀。你有十年的時間
把這片沼澤變回一座城市。"

["2.14"]
len = 260
zh = "日本東京，1957 年——
有人發現一隻巨大的爬蟲類生物正
朝東京灣前進。牠似乎是被大量的
工業污染吸引來的。先控制住火勢，
再重建工業中心。你有五年的時間。"

["2.15"]
len = 223
zh = "德國漢堡，1944 年——
二次大戰盟軍對德國城市的燒夷彈
轟炸造成巨大的破壞與傷亡，住在
市中心的人風險最高。你必須在轟炸
期間控制住火風暴，戰後再重建城市。
你有五年的時間。"

["2.16"]
len = 224
zh = "美國加州舊金山，1906 年——
地震本身的損害，比起隨後那場燒了
好幾天才控制住的大火，其實算輕的。
一千五百人喪生。你首先要處理的是
火勢，然後清除瓦礫、開始重建。
你有五年的時間。"

["2.17"]
len = 246
zh = "美國達斯維利，1900 年——
這裡過去一百年來沒什麼變化，
居民也開始覺得無聊了。他們認為
只要有對的領導者，達斯維利可以
成為下一座偉大的城市。你的工作
是吸引新的成長與開發，在三十年內
把達斯維利變成一座大都會。"

["2.18"]
len = 377
zh = "美國麻州波士頓，2010 年——
市中心新蓋的核子反應爐之一即將
發生嚴重的爐心熔毀。反應爐周邊
會受到嚴重的輻射污染，逼得你必須
繞著它重整整座城市。你有五年的
時間把情況控制下來。"

["2.19"]
len = 258
zh = "瑞士伯恩，1965 年——
這裡的道路一天比一天壅塞，居民
很不滿，要求你想想辦法。有人提議
用大眾運輸系統來解決，但那需要
對市中心做大規模的重新分區。
你有十年的時間。"

