mark = "\xfe\xf9\xffSaddleBern, 1914-\nThe roads here are so filled with\nhorses and cows and people and\nwagons that you can't get there\nfrom here. You might try puttin' in\na Steam Train transport system,\nbut to do that you'll have to\nrezone the downtown area. You\nhave ten years."
