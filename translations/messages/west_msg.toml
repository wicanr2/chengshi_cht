zh = ""

[60]
len = 231
mark = "\xfe\xd5\xffYOU'RE A WINNER- Your mayorial skill\nand city planning expertise have\nearned you the KEY TO THE CITY. The\nlocals are throwin' a parade in your\nhonor, and namin' their first-born\nyoung'uns after you. Why not run for\ngovernor?"
zh = ""

[61]
len = 278
mark = "\xfe8\xffGIANT TUMBLEWEED - The biggest,\ndustiest, tumbliest, weediest\nTumbleweed either side o' the\nMississippi just rolled into town.\nIf I were you I'd foller it, put\nout the fires, restore the water,\nand hope it goes away soon. 'Course,\nI ain't you, so I'm gittin'."
zh = ""

[62]
len = 269
mark = "\xfe\xf6\xff        MEGALOPOLIS\nAn easterner came way out West,And at first we wasn't impressed.\nBut goldang and doggone,\nWe're 500K strong....\nAnd now we all think you're the best!"
zh = ""

[63]
len = 188
mark = "\xfe\xda\xffCAPITAL- Whee doggie! This here city\nis now a capital. They's 50,000\ncowpokes pokin' around this town.\nYour future looks bright."
zh = ""

[64]
len = 133
mark = "\xfe\xdc\xffTOWN- Grab yer fiddle - we're havin'\na hoedown! Our little village has\ngrown into a real town with\n2,000 citizens."
zh = ""

[65]
len = 280
mark = "\xfe\xfa\xffRio de Grande,  1996 -\nOkay, you Urban Cowboys, git ready\nfer a flood. It'll be a real doozie\n- the biggest one since Noah's time.\nThe areas of the city along the\ncoast are gonna be wasted. You will\nhave 10 years to turn this swamp\nback into a city again."
zh = ""

[66]
len = 263
mark = "\xfe\xfb\xffBoomtown, 1893-\nLook out! A gang of claim jumpers\nstole a few cases of dynamite from\nthe mine and are set to blow up the\nwhole town. You better control the\nfires quick as you can, then rebuild\nthe city. You have five years."
zh = ""

[67]
len = 227
mark = "\xfe\xfe\xffDeadwood,  1849-\nThis town is so boring, the dawgs\npray for fleas so they'll have\nsomething to do. With the right kind\nof leader, this town could amount\nto something - but then again, maybe\nnot. The job is yours if you want\nit. You have 30 years."
zh = ""

[68]
