[59]
len = 180
mark = "\xfe\xf5\xffNUCLEAR MELTDOWN-A nuclear meltdown\nhas occurred at your power plant.\nWe told you this would happen, but\ndid you listen?\nMany  generations will confront this\nproblem before it goes away so don't\nexpect to be re-elected."
zh = ""

[60]
len = 305
mark = "\xfe\x9c\xffIMPEACHMENT NOTICE - You're outa here!\nCan we talk? I gotta say your city\nplanning skills leave a lot to be\ndesired. Your management style\nbefits a stormtrooper, and your\npolitical acumen is nonexistent.\nObviously you didn't read the great\nmanual that came with SimCity. I\nworked so hard on it, and nobody\never reads it. Nobody appreciates\nme. I think I'll eat some worms."
zh = ""

[61]
len = 244
mark = "\xfe\xeb\xffPOLLUTION ALERT - Pollution in this\ncity is beyond belief. We can't\ndrink the water, breath the air,\nor eat food from our gardens.\nRumor has it that some poeple here\nwould punch you in the nose if they\ncould see it through the smog. Either\nclean up your act or the members\nof Sim First will be spiking your\ndrinks."
zh = ""

[62]
len = 214
mark = "\xfe\xd9\xffMETROPOLIS - I knew you could do it.\nNot just anyone can build and run\na city with a population of\n100,000. But I knew from the first\ntime I saw you, that you were the\none in a million special person who\ncould do it. Now about that cabinet\npost opening..."
zh = ""

[63]
