zh = ""

[64]
len = 124
mark = "\xfe\xdd\xffRetroit, MI. 2127-\nBuilt on the smouldering ruins of\nDetroit, this newly incarnated\nindustrial city is following in\nits parents footsteps.  Plummeting\nland values and unemployment have\nincreased crime in the inner-city\nto chronic levels.  You have 10 years\nto reduce crime and rebuild the\nindustrial base of the city. "
zh = ""

[65]
len = 290
mark = "\xfe\xf8\xffHollywood,  2112-\nMonster movies have never lost\ntheir popularity. The demand for\nbigger, more destructive monsters\nhas led to the design of Ralph,\na semi-intelligent\nrobotic device that decided to go\nfor a joywalk through the city\ncenter. You have 5 years to get\nthings under control."
zh = ""

