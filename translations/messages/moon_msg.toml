[58]
len = 4
mark = "TRAFFIC WARNING - Traffic in this\ncrater stinks like an Earthling. It\ntakes forever to get anywhere. If I\nliked sitting around going nowhere\nfor hours at a time, I would have\nstayed on Earth. Either build more\nroads and rails or learn to breathe\nin a vaccuum."
zh = ""

[59]
len = 247
mark = "\xfe\xf5\xffEXTRA TERRESTRIAL VIRAL CONTAMINATION\nIt seems that an E.T. virus has\nmade itself at home near one of the\npower plants. You are advised to\navoid the area until it goes away.\nThat is if it ever goes away....."
zh = ""

[60]
len = 355
mark = "\xfe\x9c\xffDEPORTATION NOTICE - You're a very\nnice person, and you're not a bad\nlooker (by moon standards, anyway),\nbut when it comes to city planning\nand management you don't know your\nelbow from a crater in the ground.\nNothing personal, but goof-ups like\nyou just aren't safe on a world with\nno oxygen. You're on the next earth-\nbound shuttle - and don't come back\nuntil you memorize the SimCity\nmanual."
zh = ""

[61]
len = 277
mark = "\xfe\xeb\xffPOLLUTION ALERT- Pollution in this\ncity has exceeded the maximum\nallowable amounts established by\nthe SimCity Interplanetary\nPollution Agency. And on a world\nthat survives on recycled air and\nwater this is serious. Either\nclean up your act or you'll be\nrecycled."
zh = ""

[62]
len = 208
mark = "\xfe\xd9\xffMOONTROPOLIS - Your capital city has\nnow achieved the status of moontro-\npolis. The current population is\n100,000. We'd sing you songs of\npraise, but the only songs we know\nare Lunie Tunes."
zh = ""

[63]
len = 143
mark = "\xfe\xdb\xffCITY- Your town has grown into a\nfull sized city, with a current\npopulation of 10,000. Not bad for\nan Earthling."
zh = ""

[64]
len = 91
mark = "\xfe\xdd\xffDeuterium, 2267-\nOne of the original manufacturing\ncolony cities, Deuterium was once\nthe Moon Rover manufacturing center\nof the solar system. It still is.\nUnfortunately, these Rovers last a\nlong time, so there's no demand.\nNow this city is the crime pit\nof the solar system. You have 10\nyears to reduce crime and rebuild\nthe industrial base of the city."
zh = ""

[65]
len = 335
mark = "\xfe\xf8\xffTycho, 2252-\nA huge indestructable alien creature\nhas stopped in for a visit and a\nquick bite of anything and anyone\nin its path. It seems to find areas\nof industrial pollution very tastey.\nTry to control those oxygen-wasting\nfires, then start rebuilding. You\nhave five years."
zh = ""

[66]
len = 290
mark = "\xfe\xfd\xffMoon Francisco, 2201-\nBecause of its precarious position\non the San Antares fault, this city\nwas named after its shakey counter-\npart on Earth. When things start to\nrock, control the fires first -\npreserve oxygen! Then clear the\nrubble and start re-building.\nYou have five years."
zh = ""

[67]
len = 292
mark = "\xfe\xff\xffBoscovitch, 2305-\nJust when you think it's safe to go\nback in the vaccuum, along comes\nanother one of those annoying\nlittle problems....like this Alien\nviral contamination thing. Can't\nlive with it, can't kill it. You\njust give it room. You have 5 years\nto rebuild around the contamination."
zh = ""

