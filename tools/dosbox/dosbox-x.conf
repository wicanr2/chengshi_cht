# SimCity 1.10（DOS）在 DOSBox-X 底下的設定。
#
# cycles 寫死不用 auto：auto 會隨主機負載變動，同一段操作錄出來的音訊
# 長度就不一樣，對相關時對不齊。可重現性優先。
[sdl]
fullscreen=false
autolock=false
waitonerror=false
# DOSBox-X 預設在視窗頂端放一條選單列，會把畫面往下推、讓座標對不上。
showmenu=false
output=surface

[dosbox]
machine=svga_s3
memsize=16
captures=/tmp/capture

[render]
frameskip=0
aspect=false

[cpu]
core=normal
cputype=386
cycles=fixed 20000

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=25

[speaker]
pcspeaker=true
pcrate=22050
tandy=on
tandyrate=22050
disney=true

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
oplmode=auto
oplrate=22050

[parallel]
parallel1=disney

[joystick]
joysticktype=none

[autoexec]
mount c /tmp/game
c:
