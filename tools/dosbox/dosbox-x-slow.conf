# SimCity 1.10（DOS）在 DOSBox-X 底下的設定。
#
# cycles 寫死不用 auto：auto 會隨主機負載變動，同一段操作錄出來的音訊
# 長度就不一樣，對相關時對不齊。可重現性優先。
[sdl]
fullscreen=false
autolock=false
waitonerror=false
# DOSBox-X 預設在視窗頂端放一條選單列，會把畫面往下推、讓座標對不上。
showmenu=false
output=surface

[dosbox]
machine=svga_s3
memsize=16
captures=/tmp/capture

[render]
frameskip=0
aspect=false

[cpu]
core=normal
cputype=386
cycles=fixed 5000

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=25

[speaker]
# impulse 是 DOSBox-X 專門為了重現 PC 喇叭的 PWM 數位音訊做的模型。
# 預設的 true（＝ 0.74 那種方波模型）只放得出單頻嗶聲，遊戲用 PWM 餵
# 出來的取樣會整個糊掉。見 docs/re/16-dos-oracle.md §4。
pcspeaker=impulse
pcrate=44100
tandy=on
tandyrate=22050
disney=true

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
oplmode=auto
oplrate=22050

[parallel]
parallel1=disney

[joystick]
joysticktype=none

[autoexec]
mount c /tmp/game
c:
