["2.0"]
len = 203
zh = "交通警訊——這座城的交通會出人命。\n通勤族開始玩碰碰車，公路上的槍擊\n正在變成新的運動項目。你最好多蓋\n幾條道路和單軌，不然就去弄一台防\n彈禮車。"

["2.1"]
len = 217
zh = "治安警報——這座城的犯罪集團一定\n把你打點得很好——不然就是你對這\n裡的治安又聾又瞎。你再不把問題壓\n下來，歐洲警察就要宣布戒嚴並把你\n拉下台了。"

["2.2"]
len = 174
zh = "生物危害——你其中一座發電廠附近\n的基因操作實驗失控了。建議你避開\n那一帶，直到安全為止——大約八千\n年。"

["2.3"]
len = 223
zh = "　　　你贏了！\n　　Felicitations！\n　Ich gratuliere Sie！\n　　　幹得漂亮！\n你在設計、規劃與管理上的品味、\n技巧與才華，為你贏得了市鑰。\n鞠個躬吧。給自己加個薪。"

["2.4"]
len = 228
zh = "　　　彈劾通知\n我很難過，但你已經不再是這座城的\n領導者了。事實上，這裡也不歡迎你\n繼續住下去。請聯絡我們的歐洲代理\n商，索取說明書的法文或德文版。"

["2.5"]
len = 299
zh = "怪獸來襲——有人在水裡發現一隻巨\n大、粗魯、吵鬧、沒禮貌的蛛形生物。\n那要嘛是美國觀光客，要嘛是煙霧怪\n獸。牠所到之處一片狼藉。你只能等\n牠離開，然後把小孩的禮儀重新教一\n遍。"

["2.6"]
len = 262
zh = "污染警報——本市的污染已經超過歐\n洲模擬污染管理局訂定的上限。你正\n冒著造成嚴重生態後果的風險。要嘛\n把它清乾淨，要嘛在下次選舉失去綠\n黨的選票。"

["2.7"]
len = 231
zh = "　　　　超級都會\n歐洲雖是個古老的地方，\n你卻蓋出一座優雅的新城。\n有人偏愛傳統，\n卻沒有人嘲笑你——\n因為我們五十萬人就在他們面前。"

["2.8"]
len = 180
zh = "大都會——你的城市已經取得大都會\n的地位與排名，目前人口十萬。\n以你的規劃能力，可以考慮去設計電\n腦遊戲。"

["2.9"]
len = 124
zh = "首府——你的城市已經成為首府，\n目前人口五萬。你的政治前途一片\n光明。"

["2.10"]
len = 109
zh = "城市——你的城鎮已經長成一座完整\n的城市，目前人口一萬。\n繼續保持！"

["2.11"]
len = 90
zh = "城鎮——恭喜，你的村莊已經升格為\n城鎮，現在有兩千位市民了。"

["2.12"]
len = 312
zh = "德特華，2227 年——\n這個犯罪橫行的小鎮，是全歐洲每一\n個重要罪犯的家。正經市民整夜——\n以及整天——把自己鎖在屋裡。\n你以打擊犯罪的政見當選市長。\n你有十年的時間降低犯罪，並重建本\n市的工業基礎。"

["2.13"]
len = 327
zh = "第戎芥末之河，2302 年——\n儘管環保團體與綠黨百般努力，溫室\n效應仍讓全球均溫上升了約華氏四度。\n冰冠融化使全球海平面上升，洪水與\n侵蝕造成巨大破壞。你有十年的時間\n把這片沼澤變回一座城市。"

["2.14"]
len = 247
zh = "怪獸維爾，2212 年——\n一隻毫無品味、毫無風格、完全沒有\n時尚感的大型煙霧怪獸正從海上入侵。\n啊，是了，一定又到觀光季了。\n先控制火勢，再重建工業中心。\n你有五年的時間。"

["2.15"]
len = 296
zh = "豆腐堡，2199 年——\n這座看似人畜無害的歐洲素食中心，\n即將以「反對歐洲政治統一的恐怖分\n子最後據點」之名留名青史。你必須\n在轟炸期間控制火勢，然後重建城市。\n你有五年的時間。"

["2.16"]
len = 258
zh = "老法蘭西斯科，2161 年——\n這座狂野迪斯可夜生活之家，是歐洲\n的搖擺之都。沒有人確定搖晃是地震\n造成的，還是音響太大聲。\n先控制火勢，然後清除瓦礫、開始重\n建。你有五年的時間。"

["2.17"]
len = 281
zh = "無聊之城，2155 年——\n這座……（呵欠）不好意思，這座城\n市……（呵欠）又不好意思。這地方\n無聊到……（呵欠）我連講都講不完\n就……（呵欠）睡……（呵欠）著了。\n看看你能不能（呵欠）把這地方變成\n（呵欠）一座大都會。\n你有三十年的時間。"

["2.18"]
len = 367
zh = "洛斯頓，2265 年——\n你即將面對一個未來可能很常見的問\n題：科技跑得比常識快。在核電廠旁\n邊做基因操作實驗，也許不是什麼好\n主意。輻射外洩可能造成意料之外的\n結果。何必擔心呢？……說不定不會\n出什麼壞事……你有五年的時間把情\n況控制下來。"

["2.19"]
len = 252
zh = "瑞士伯恩，2220 年——\n顯然上一任伯恩的模擬城市市長沒做\n出什麼成績，因為這一則和你在基本\n圖形集裡玩的劇本一模一樣。\n看看你能不能把交通問題處理得好一\n點。你有十年的時間。"

