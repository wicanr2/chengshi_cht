["2.0"]
len = 259
zh = "交通警訊——這個坑裡的交通臭得像\n地球人。去哪都得花上一輩子。\n我要是喜歡連坐好幾個小時哪裡都去\n不了，當初就待在地球了。要嘛多蓋\n幾條道路和軌道，要嘛學會在真空裡\n呼吸。"

["2.1"]
len = 244
zh = "治安警報——本市犯罪橫行。這裡兇\n到學生會勒索老師的午餐錢，月球老\n太太隨身帶雷射槍，程式設計師晚上\n得把手指鎖起來，不然會被偷走。"

["2.2"]
len = 207
zh = "　　外星病毒污染\n看來有一種外星病毒在你其中一座發\n電廠附近住下來了。建議你避開那一\n帶，直到它離開為止。\n前提是它真的會離開……"

["2.3"]
len = 352
zh = "你贏了——你成功完成任務了！我們\n都以你為榮，也很榮幸認識你。\n事實上我們對你的表現太滿意了，\n所以把你回地球的太空梭班次取消了。\n我們想你應該不會介意。別生氣……\n這樣吧……我讓你參一腳穩賺的生意\n——你可以買下一座綠乳酪礦的\n五成股份……"

["2.4"]
len = 394
zh = "遣返通知——你人很好，長得也不差\n（至少以月球的標準來說），但講到\n都市規劃與管理，你連自己的手肘和\n地上的坑都分不清楚。沒有針對誰的\n意思，但像你這樣一直出包的人，\n在一個沒有氧氣的世界上實在不安全。\n你搭下一班回地球的太空梭——\n沒把《模擬城市》說明書背起來就別\n回來。"

["2.5"]
len = 274
zh = "外星怪獸來襲——有人在塵池裡發現\n一隻巨大的外星生物。科學家想研究\n牠，異種生物學家想解剖牠，小孩想\n跟牠玩，生意人想把牠抓去開動物園。\n祝你好運，市長，牠走了再叫我。"

["2.6"]
len = 262
zh = "污染警報——本市的污染已經超過模\n擬城市星際污染管理局訂定的上限。\n在一個靠回收空氣與水維生的世界上，\n這件事很嚴重。要嘛把它清乾淨，\n要嘛你自己被回收。"

["2.7"]
len = 205
zh = "　　　　超級都會\n在我們月球人眼中，你是英雄，\n你在月球的荒郊蓋起一座城。\n我們一邊漫遊一邊做夢，\n夢見自己那甜蜜的巨蛋家園——\n裡面住著五十萬月球人！"

["2.8"]
len = 189
zh = "月球大都會——你的首府已經晉升為\n月球大都會，目前人口十萬。\n我們很想為你唱首頌歌，可惜我們只\n會唱月球樂一通。"

["2.9"]
len = 140
zh = "首府——你的城市已經成為首府，\n目前人口五萬。繼續保持，\n說不定哪天你就能回地球了。"

["2.10"]
len = 112
zh = "城市——你的城鎮已長成一座完整的\n城市，目前人口一萬。\n以一個地球人來說算不錯了。"

["2.11"]
len = 88
zh = "城鎮——恭喜，你的村落已經升格為\n城鎮，現在有兩千位月球人了。"

["2.12"]
len = 353
zh = "氘城，2267 年——\n作為最早的製造業殖民城市之一，\n氘城曾經是太陽系的月球車製造中心。\n現在依然是。可惜這些月球車太耐用\n了，所以沒有需求。如今這座城成了\n太陽系的犯罪之窟。你有十年的時間\n降低犯罪，並重建本市的工業基礎。"

["2.13"]
len = 332
zh = "月球人之河，2342 年——\n這座位於巨大塵池畔的美麗城市，\n是月球上最好的度假地之一。\n事實上它好到連住在塵池底部的蔓延\n酸性黴菌都決定來這裡度假。\n你有十年的時間把這堆融化的爐渣變\n回一座城市。"

["2.14"]
len = 276
zh = "第谷，2252 年——\n一隻巨大而打不死的外星生物順道來\n訪，順便把路上的任何東西和任何人\n咬一口。牠似乎覺得工業污染區特別\n好吃。先想辦法控制那些浪費氧氣的\n火，然後開始重建。\n你有五年的時間。"

["2.15"]
len = 287
zh = "胡扯基地，2239 年——\n很準時。那群煩人的外星人又來了，\n在我們的殖民地上到處丟炸藥，\n然後看我們活不活得下來。我們已經\n向他們的政府抗議過，但入侵是他們\n的國民運動。月球人能怎麼辦？\n你有五年的時間收拾這團亂。"

["2.16"]
len = 279
zh = "月球法蘭西斯科，2201 年——\n由於它坐落在危險的聖安塔瑞斯斷層\n上，這座城市便以地球上那個愛搖的\n對應城市命名。開始搖的時候先控制\n火勢——省氧氣！然後清除瓦礫、\n開始重建。你有五年的時間。"

["2.17"]
len = 289
zh = "寧靜海基地，2195 年——\n這地方比艙門螺栓還死氣沉沉\n（我們這裡沒有門釘）。我們知道，\n只要有對的領導者，這裡可以成為一\n座刺激又賺錢的殖民地。你的工作是\n吸引新的成長與開發，在三十年內把\n寧靜海基地變成一座月球大都會。"

["2.18"]
len = 290
zh = "波士科維奇，2305 年——\n就在你以為可以安心回到真空裡的時\n候，另一個煩人的小問題又來了……\n比如這個外星病毒污染。共存不了，\n又殺不死，只能讓出空間給它。\n你有五年的時間繞著污染區重建。"

["2.19"]
len = 326
zh = "月球伯恩，2260 年——\n月球上這麼空曠，你會以為永遠不可\n能有交通問題。可是就算我們把家安\n在一顆衛星上，一講到開車我們還是\n地球人。大眾運輸系統會有幫助，\n但那需要對市中心做大規模的重新分\n區。你有十年的時間。"

