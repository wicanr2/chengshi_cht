["2.0"]
len = 179
zh = "交通警訊——饒了我們吧。在這座城\n裡要去哪都得花上好幾個小時，交通\n爛透了。要嘛想辦法改善這個沒法忍\n的狀況，要嘛去弄一台防彈禮車。"

["2.1"]
len = 177
zh = "　　治安警報\n我們這座美麗的城，實在可憐，\n犯罪的情況，一點也不好看。\n你最好快點修好——\n如果你還想保住這份工作，\n否則憤怒的暴民\n會把你票出辦公室！"

["2.2"]
len = 219
zh = "爐心熔毀——你的發電廠發生爐心熔\n毀。我們早就說過會出事，你有聽嗎？\n這問題要好幾個世代才會過去，\n所以別指望連任了。"

["2.3"]
len = 302
zh = "你贏了——幹得好！你已經證明自己\n是都市規劃的天才、有藝術品味的設\n計者、幹練的管理者、值得追隨的領\n袖，以及一個全方位的好人。我們翻\n字典查「了不起」的時候，會看到你\n的照片。能借我五十塊嗎？"

["2.4"]
len = 372
zh = "彈劾通知——你出局了！\n我們能談談嗎？你的都市規劃能力實\n在有很大的進步空間，你的管理風格\n像個突擊隊員，政治敏感度則完全不\n存在。你顯然沒讀《模擬城市》附的\n那本很棒的說明書。我那麼用心寫，\n卻沒有人讀。沒有人懂我。\n我想我去吃幾條蟲好了。"

["2.5"]
len = 241
zh = "怪獸來襲——要嘛是一隻又大又醜的\n怪獸從海裡冒出來大肆破壞、製造死\n亡與災難，要嘛就是你們這座城的毒\n品問題真的很嚴重。不管是哪一種，\n你都得等它離開再重建城市。"

["2.6"]
len = 314
zh = "污染警報——這座城的污染已經誇張\n到難以置信。水不能喝、空氣不能吸、\n自家種的菜也不能吃。聽說這裡有些\n人很想揍你一拳，前提是他們能穿過\n霧霾看見你的鼻子。要嘛把它清乾淨，\n要嘛「市民優先」的成員就要在你的\n飲料裡下料了。"

["2.7"]
len = 211
zh = "　　　　超級都會\n你是這個國家的驕傲，\n我們為你的健康與財富祈禱。\n雖然我們不設王室，\n五十萬市民\n每天心甘情願為你效勞。"

["2.8"]
len = 255
zh = "大都會——我就知道你辦得到。不是\n誰都能建起並經營一座十萬人的城市。\n但我第一次見到你就知道，你是那個\n百萬中選一、做得到的人。\n說到那個入閣的缺……"

["2.9"]
len = 144
zh = "首府——你的城市現在是模擬國的首\n府了。五萬名模擬市民仰望著你的領\n導。你的政治前途一片光明。"

["2.10"]
len = 111
zh = "城市——你的城鎮已長成一座完整的\n城市，模擬人口一萬。\n繼續保持！"

["2.11"]
len = 121
zh = "城鎮——還不錯……你的村莊現在正\n式成為城鎮了，有兩千位市民。\n沒什麼好寫信回家炫耀的，\n但是個好的開始。"

["2.12"]
len = 318
zh = "美國密西根州瑞特律，2127 年——\n這座新生的工業城建在底特律仍在冒\n煙的廢墟上，正在重蹈上一代的覆轍。\n地價暴跌與失業使得市中心的犯罪惡\n化成長期問題。你有十年的時間降低\n犯罪，並重建本市的工業基礎。"

["2.13"]
len = 287
zh = "珍妮特之河，2202 年——\n到二十一世紀中葉，溫室效應讓全球\n均溫上升了約華氏四度。極地冰冠融\n化，全球海平面上升，沿海地區被洪\n水與侵蝕摧毀。你有十年的時間把這\n片沼澤變回一座城市。"

["2.14"]
len = 285
zh = "好萊塢，2112 年——\n怪獸電影從來沒有退流行過。\n觀眾對更大、更具破壞力的怪獸的需\n求，催生了「拉夫」——一具半智慧\n的機械裝置，而它決定到市中心散個\n步。你有五年的時間把情況控制下來。"

["2.15"]
len = 298
zh = "漢堡鎮，2099 年——\n這座肉品加工鎮即將遭到一群叛變的\n基改智慧乳牛攻擊。牠們組成了一個\n政治行動團體，叫「反食用動物突變\n體聯盟」。請在轟炸期間控制火勢，\n然後重建。你有五年的時間。"

["2.16"]
len = 201
zh = "美國加州新法蘭西斯科，2061 年——\n又來了。1906、1989、2012 年那次\n「大的」，現在是 2061。你會以為他\n們早該學乖了……你經歷過這種事，\n知道該怎麼做。你有五年的時間。"

["2.17"]
len = 280
zh = "美國回扣鎮，2055 年——\n號稱世界打呵欠之都，回扣鎮無聊到\n極點。沒事可做、沒地方可去、沒人\n可見。這地方就要死於終極的虛無了\n——除非你能在三十年內把這個破洞\n般的城市變成一座大都會。"

["2.18"]
len = 313
zh = "美國麻州柏德頓，2165 年——\n這座城以它最有名的市民重新命名，\n而它的其中一座核子反應爐即將出一\n場相當糟糕的意外。反應爐附近會受\n到嚴重的輻射污染，逼得你必須繞著\n它重整整座城市。\n你有五年的時間把情況控制下來。"

["2.19"]
len = 242
zh = "陽光伯恩，2120 年——\n這裡的輸送管吃不下所有的交通量，\n連最新的交通導引電腦都沒轍。\n這座城需要一套大眾運輸系統，\n那需要對市中心做大規模的重新分區。\n你有十年的時間。"

