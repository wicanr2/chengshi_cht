["2.0"]
len = 203
zh = "交通警訊——陛下，街上的人多到我們\n肩挨著肩，幾乎動彈不得。要不是我\n知道得清楚，還以為這是二十世紀的\n東京。"

["2.1"]
len = 203
zh = "治安警報——本城的犯罪已經失控。\n暴民在城中搶劫、破壞。您和宮廷衛\n隊若不盡快壓下來，他們會把您的心\n血全毀了。"

["2.2"]
len = 216
zh = "瘟疫警告——水車附近爆發了致命的\n瘟疫。謀士建議所有人避開那一帶，\n因為無藥可醫。這個難題大概要好幾\n個世代才熬得過去。"

["2.3"]
len = 240
zh = "您勝了！！——您的規劃才能、治理\n手腕與藝術品味，為您贏得極大的\n敬重。子民會為您立碑，並以您的名\n字為長子命名。有朝一日，您也許會\n成為將軍！"

["2.4"]
len = 307
zh = "行刺警告——本城的百姓不願再讓一\n位無能的主上統治下去。您若不立刻\n離開，將被公開處刑。我們希望您能\n從錯誤中學到東西，將來成為一位好\n君主。把說明書讀一遍，再來一次。"

["2.5"]
len = 243
zh = "怪獸來襲——一隻巨大的爬蟲類生物\n從噩夢裡現身，牠似乎被城市中心吸\n引，所到之處寸草不留，沒有東西攔\n得住牠。等牠離開，有得重建了。"

["2.6"]
len = 212
zh = "污染警報——主上，這座城的空氣傷\n了我們的肺與眼睛，聞起來也極不調\n和。天地的平衡正受威脅，我們可能\n為後世立下壞榜樣。"

["2.7"]
len = 167
zh = "　　　　超級都會\n您是亞洲的一代明君，\n城中喧囂從未擾亂您的心神。\n五十萬子民\n唯您之命是聽，\n活著只為頌讚您的功勳。"

["2.8"]
len = 186
zh = "大都會——您達成了一個艱難的目標，\n確立了自己作為偉大領袖的地位。\n追隨者已達十萬人。陽光普照在您身\n上，鳥兒也為您歌唱。"

["2.9"]
len = 111
zh = "首府——主上，本城已成為首府，\n人口達到五萬。您的未來一片光明。"

["2.10"]
len = 111
zh = "城市——您的城鎮已長成一座完整的\n城市，目前人口一萬。\n好的開始！"

["2.11"]
len = 87
zh = "城鎮——恭喜，您的村落已成長為城\n鎮，現在有兩千名子民了。"

["2.12"]
len = 312
zh = "日本鈴木，1308 年——\n像二十世紀的底特律一樣，鈴木是一\n座製造業城市（人力車），如今陷入\n衰退。地價暴跌與失業使城中的犯罪\n惡化成長期問題。您有十年的時間降\n低犯罪，並重建本城的工業基礎。"

["2.13"]
len = 199
zh = "暹羅南潭，1381 年——\n這座暹羅的濱海城市即將被洪水淹沒，\n沿海地區會被大水與侵蝕摧毀。\n您有十年的時間把這片沼澤變回一座\n城市。"

["2.14"]
len = 209
zh = "中土提基埔，1291 年——\n有人發現一隻巨大的爬蟲類生物正朝\n提基埔灣前進。跟著牠走，修復水路、\n控制火勢，然後重建城市。\n您有五年的時間。"

["2.15"]
len = 208
zh = "中土燕華，1278 年——\n一間煙火作坊起火，整座作坊爆炸，\n火箭四散飛過全城。您必須先控制火\n勢，再重建城市。\n您有五年的時間。"

["2.16"]
len = 183
zh = "日本震町，1240 年——\n您即將面對一場大地震。若不立刻控\n制火勢，火造成的損害會遠大於地震\n本身。您有五年的時間。"

["2.17"]
len = 205
zh = "無聊町，1234 年——\n這裡過去一千年來沒什麼變化。\n您的工作是吸引新的成長與開發，\n在三十年內把這座城變成一座大都會。"

["2.18"]
len = 262
zh = "菲律賓布提爾，1344 年——\n其中一座水車即將爆發致命的瘟疫。\n水車周邊會受到危險的污染，逼得您\n必須繞著它重整整座城市。\n您有五年的時間把情況控制下來。"

["2.19"]
len = 254
zh = "中土交通，1299 年——\n這裡的道路一天比一天壅塞，子民很\n不滿。您考慮過鋪設大眾人力車系統，\n但那需要對城中心做大規模的重新分\n區。您有十年的時間。"

