["2.0"]
len = 176
zh = "交通警訊——這鎮上的交通爛透了。\n過個街不撞上馬屁股都難，\n連小娃兒上學都得一路開槍開過去。"

["2.1"]
len = 181
zh = "治安警報——這鎮子對人對牲口都不\n安全。正經人和好馬走在街上不被搶\n都不行，銀行這禮拜已經被搶三次了！"

["2.2"]
len = 228
zh = "水源污染——蒸汽抽水機旁邊的水被\n污染了。別喝、別洗、看都別看。\n這回攤上大事了，得拖好幾代，\n別憋著氣等。"

["2.3"]
len = 224
zh = "你贏了——憑著你的市長手腕與都市\n計劃本事，你贏得了市鑰。鎮上的人\n正為你辦遊行，還拿你的名字給頭一\n個娃兒命名。要不要去選州長？"

["2.4"]
len = 275
zh = "　　　絞索派對邀請函\n我們受夠你了，你這個下三濫、\n偷牛拐馬、滿嘴胡話的馬屁股——\n抱歉了，扳機老兄。這鎮上容不下你\n和任何一個正經人。所以往山裡跑吧\n——現在就跑——不然就把說明書讀\n一遍，再來一次。"

["2.5"]
len = 261
zh = "巨型風滾草——密西西比河兩岸最大、\n最髒、滾得最凶、草最多的風滾草滾\n進鎮上了。我要是你，就跟著它跑、\n把火滅了、把水弄回來，然後求它快\n點走。不過我不是你，所以我先閃了。"

["2.6"]
len = 266
zh = "污染警報——這裡到底是搞什麼名堂\n——臭鼬大會嗎？空氣裡的味道能嗆\n死臭鼬，垃圾場能噎死蛆。水嚐起來\n像是從屠宰場下游流過來的。\n連豬都在捏鼻子了。"

["2.7"]
len = 169
zh = "　　　　超級都會\n東邊來了個生人，一開始咱們沒當回事。\n可是老天爺啊，\n咱們五十萬人了……\n現在誰都說你最行！"

["2.8"]
len = 185
zh = "大都會——好傢伙！你那個小小的莊\n子塞滿啦——咱們手上有一座大都會\n了！十萬人吶！恭喜。\n要不要去選州長？"

["2.9"]
len = 128
zh = "首府——我的老天！這鎮子現在是首\n府了。五萬個牛仔在這兒晃來晃去。\n你的前途一片光明。"

["2.10"]
len = 130
zh = "城市——我的媽呀！咱們有一座完整\n的城市了，一萬個大老爺們兒跟大姑\n娘們兒！繼續保持！"

["2.11"]
len = 114
zh = "城鎮——抄起你的琴——咱們要辦舞\n會啦！咱們那個小村子長成了真正的\n城鎮，有兩千個居民了。"

["2.12"]
len = 277
zh = "美國密西根州普特律，1921 年——\n這裡曾經是西部的篷車之都，如今日\n子難過。地價暴跌與失業使得鎮中心\n的犯罪惡化成長期問題。你有十年的\n時間降低犯罪，並重建本鎮的工業\n基礎。"

["2.13"]
len = 255
zh = "大河谷，1996 年——\n好啦各位都市牛仔，準備接洪水吧。\n這回可不得了——是諾亞那年代以來\n最大的一場。沿岸的地區全要泡湯。\n你有十年的時間把這片沼澤變回一座\n城市。"

["2.14"]
len = 260
zh = "東京歐格雷迪，1906 年——\n當心密西西比河以西出現過最大、最\n凶、最難搞的那玩意兒！殺人風滾草\n來襲啦！先想辦法控制火勢，再重建\n市中心。你有五年的時間。"

["2.15"]
len = 223
zh = "爆炸鎮，1893 年——\n小心！一夥搶礦的傢伙從礦坑偷了幾\n箱炸藥，打算把整個鎮炸了。你最好\n盡快控制火勢，然後重建。\n你有五年的時間。"

["2.16"]
len = 224
zh = "美國加州模擬西斯科，1855 年——\n等等！這麼一段真實歷史，跑到一個\n無厘頭的西部版《模擬城市》裡做什\n麼？我拒絕參與這種……這種……\n現實的東西。你自己看著辦。\n你有五年的時間。"

["2.17"]
len = 246
zh = "死木鎮，1849 年——\n這鎮子無聊到狗都在求跳蚤上身，好\n歹有點事做。要是有個對的領導者，\n這鎮子也許能成點氣候——不過也可\n能不行。你想接就接。\n你有三十年的時間。"

["2.18"]
len = 377
zh = "母牛頓，1959 年——\n這個熱鬧的小鎮，是以第一任鎮長最\n愛的那頭母牛命名的。有人回報水源\n出了問題，八成是被污染了。\n你得繞著中毒的區域重整整個鎮，\n因為幫得上忙的現代科學還沒傳到老\n西部來。你有五年的時間把情況控制\n下來。"

["2.19"]
len = 258
zh = "馬鞍伯恩，1914 年——\n這裡的路上塞滿了馬、牛、人和篷車，\n從這頭根本到不了那頭。你可以試著\n架一套蒸汽火車運輸系統，但那得把\n鎮中心重新分區。\n你有十年的時間。"

