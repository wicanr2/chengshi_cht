["2.0"]
len = 154
zh = "交通警訊——本城的交通已經無解，\n百姓的火氣越來越大。要嘛多鋪幾條\n道路和馬車道，要嘛去弄一輛防石\n戰車。"

["2.1"]
len = 193
zh = "治安警報——本城的犯罪已經失控。\n暴民在城中搶劫、破壞，扒手忙得像\n在過節。再不處理，我們就要開始談\n《大憲章》了。"

["2.2"]
len = 224
zh = "瘟疫——水車附近爆發了瘟疫。水蛭\n和放血似乎都沒有用。謀士建議陛下\n與隨從避開那一帶，等到很久很久以\n後現代科學找出解藥再說。"

["2.3"]
len = 217
zh = "您贏了——您在設計、都市規劃與領導\n上的才能，證明您是一位偉大的君主。\n百姓會為您立碑，並以您的名字為長\n子命名。要不要考慮去選國王？"

["2.4"]
len = 330
zh = "解放通知\n本城的百姓已經受夠了您拙劣的規劃\n與無能的管理。一群憤怒的暴民正在\n攻打您的城堡，高喊著自由、平等與\n結社的激進口號。您也許該去鄰國拜\n訪一下表親——現在就去！（或者把\n說明書讀一遍，再來一次。）"

["2.5"]
len = 269
zh = "怪獸來襲——有人在水裡發現一隻巨\n大、卑劣、醜陋、受詛咒的生物，\n所到之處一片狼藉。也許您當初不該\n把拜怪獸的那群人逐出王國。\n唉，活到老學到老——還是活到老燒\n到老？"

["2.6"]
len = 251
zh = "污染警報——本城的污染已經超過中\n世紀環境保護署訂定的上限。您正冒\n著造成嚴重生態後果的風險。要嘛把\n它清乾淨，要嘛發明防毒面具。"

["2.7"]
len = 244
zh = "　　　　超級都會\n中世紀的您，是一方雄主，\n從太古森林裡開出一片國土。\n五十萬農奴\n為您守著疆域，\n皇家衛隊替您把邪祟踏除。"

["2.8"]
len = 224
zh = "大都會——您的王國已經取得大都會\n的地位與排名。十萬名臣民的生計與\n福祉都在您手上。以您的規劃與領導\n才能，可以考慮把自己封神了。"

["2.9"]
len = 140
zh = "首府——您的城市已經成為首府。\n您是五萬名農奴、奴隸與平民的君主\n——外加零星幾個自由市民。"

["2.10"]
len = 104
zh = "城市——您的城鎮已長成一座完整的\n城市，目前人口一萬。\n好的開始。"

["2.11"]
len = 92
zh = "城鎮——總算……您那個小得可憐的\n村落升格成城鎮了。您現在統治著兩\n千名臣民。"

["2.12"]
len = 255
zh = "虎城，1563 年——\n這個勉強稱得上城市的地方，曾經是\n一個偉大的王國。地價暴跌與失業使\n城中的犯罪惡化成長期問題。您有十\n年的時間降低犯罪，並重建本城的工\n業基礎。"

["2.13"]
len = 224
zh = "約翰之箭河，1638 年——\n這片繁榮的土地即將遭遇一場近乎聖\n經規模的大洪水，沿海地區會被大水\n與侵蝕摧毀。您有十年的時間把這片\n沼澤變回一座城市。"

["2.14"]
len = 333
zh = "托爾金，1548 年——\n一隻巨大、發臭、令人作嘔的爬蟲類\n生物從邪惡的「四門之地」冒了出來，\n正在摧毀您的工業區。您的議會裡沒\n有大法師，只能先控制火勢、修復水\n路，等怪獸離開再重建。\n您有五年的時間。"

["2.15"]
len = 301
zh = "史邦美樂，1535 年——\n法師大會出了亂子——會場上打了起\n來，閃電像雨一樣打在城裡。您已經\n把那位把會場租給法師的大臣斬了。\n現在您必須控制火勢並重建。\n您有五年的時間。"

["2.16"]
len = 202
zh = "聖方濟各，1497 年\n大地將要震動，地上的一切——人、\n牲畜與市民——都會踉蹌倒地。\n建築將崩塌，大火將蔓延全境。\n祝您有美好的一天。"

["2.17"]
len = 247
zh = "小卡美洛，1491 年——\n這個小鎮很無聊，什麼都不會發生。\n您的目標是把這個小村落建成一座擁\n有興盛工業、熱絡商業與幾位名騎士\n的城市。您能把「小卡美洛」變成\n「卡美洛」嗎？您有三十年的時間。"

["2.18"]
len = 192
zh = "醉城，1601 年——\n這座釀酒重鎮即將降下瘟疫。必須把\n水車隔離起來，才能保住倖存者。\n您有五年的時間把情況控制下來。"

["2.19"]
len = 262
zh = "焦城，1556 年——\n這裡的道路一天比一天壅塞，加上沒\n洗過澡的農民和牲畜的排泄物，這種\n交通是會死人的。您必須想想辦法。\n鋪幾條馬車路線也許有幫助，但那需\n要大規模的重新分區。\n您有十年的時間。"

